  /* Layout: single dark column (max 712px) like the Tech Report app — header, segmented nav, search, model cards. */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --card: #111113;

  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }

  .wrap {

  header.app-header { padding-block: 22px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand-mark { font-size: 18px; letter-spacing: 1.6px; font-weight: 750; color: var(--ink); }

  .app-title { font-size: 27px; line-height: 1.2; font-weight: 700; letter-spacing: -1px; margin: 4px 0 0; text-wrap: balance; }

  .search input::placeholder { color: #a0a0aa; }
  .search button { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend b { color: var(--ink); font-weight: 600; }

  .list { display: grid; gap: 14px; margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px 20px 8px; min-width: 0; }
  .card h2 { margin: 0; font-size: 20px; letter-spacing: -.4px; line-height: 1.25; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .code { font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line-2); padding: 2px 9px; border-radius: 20px; letter-spacing: .3px; font-variant-numeric: tabular-nums; }
  .head, .row { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 8px; align-items: baseline; }

  .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .rep { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
  .p { font-size: 14.5px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .p.pub { color: var(--ink); font-weight: 650; }
  .p .lbl { display: none; }

  footer { color: var(--faint); font-size: 12.5px; text-align: center; margin-top: 28px; line-height: 1.6; }

    .brand-mark span { display: block; margin: 2px 0 0; }
  }

</style>

const fmt = n => n == null ? '—' : '$ ' + n.toLocaleString('es-AR');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
DATA.forEach(m => { m.k = norm(m.n + ' ' + m.c); m.r.forEach(r => r.k = norm(r[0])); });
let line = 'all';
try { const s = localStorage.getItem('lp-line'); if (s) line = s; } catch (e) {}
const $ = id => document.getElementById(id);
function render() {
  const q = norm($('q').value.trim());
  const terms = q ? q.split(' ') : [];
  let models = 0, rows = 0, html = '';
  for (const m of DATA) {
    if (line !== 'all' && m.l !== line) continue;
    let rs = m.r;
    if (terms.length) {
      rs = m.r.filter(r => terms.every(t => m.k.includes(t) || r.k.includes(t)));
      if (!rs.length) continue;
    }
    models++; rows += rs.length;
    html += `<section class="card"><h2>${m.n}<span class="code">${m.c}</span></h2>
      <div class="head"><span>Reparación</span><span>Gremio</span><span>Empresa</span><span>Público</span></div>
      ${rs.map(r => `<div class="row"><div class="rep">${r[0]}</div>
        <div class="p"><span class="lbl">Gremio</span>${fmt(r[1])}</div>
        <div class="p"><span class="lbl">Empresa</span>${fmt(r[2])}</div>
        <div class="p pub"><span class="lbl">Público</span>${fmt(r[3])}</div></div>`).join('')}
    </section>`;
  }
  $('list').innerHTML = html || `<div class="empty">No hay resultados para “${$('q').value.replace(/[<>&]/g,'')}”.<br>Probá con el modelo (ej. A54) o el tipo de reparación.</div>`;
  $('count').textContent = `${models} modelos · ${rows} reparaciones`;
  $('clear').hidden = !$('q').value;
}
function setLine(l) {
  line = l;
  const btns = [...document.querySelectorAll('.tab-btn')];
  btns.forEach((b, i) => { const on = b.dataset.l === l; b.setAttribute('aria-selected', on); if (on) $('nav').style.setProperty('--tab-index', i); });
  try { localStorage.setItem('lp-line', l); } catch (e) {}
  render();
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => setLine(b.dataset.l)));
$('q').addEventListener('input', render);
$('clear').addEventListener('click', () => { $('q').value = ''; render(); $('q').focus(); });
setLine(['all','s','z','a','o'].includes(line) ? line : 'all');
let deferred;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').hidden = false; });
$('install').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('install').hidden = true; });
window.addEventListener('appinstalled', () => { $('install').hidden = true; });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
